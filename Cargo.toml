[package]
name = "grust"
version = "0.1.0"
edition = "2021"
authors = ["OpenHands <openhands@all-hands.dev>"]
description = "Green serverless data processing using Rust"
license = "MIT"

[dependencies]
aws-lambda-runtime = "0.8.1"
aws_lambda_events = { version = "0.10.0", default-features = false, features = ["s3"] }
aws-config = "0.56.1"
aws-sdk-s3 = "0.29.0"
chrono = "0.4"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
